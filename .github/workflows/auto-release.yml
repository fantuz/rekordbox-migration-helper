name: Release merged version

on:
  workflow_run:
    workflows: [Check and package]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: automatic-release-main
  cancel-in-progress: false

jobs:
  dispatch:
    name: Release a validated version bump
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      # Use trusted default-branch code, never a pull request or downloaded script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the version bump and dispatch the existing release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 packaging/auto_release.py
