name: Create release
run-name: Release ${{ inputs.release_version || github.ref_name }}

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_version:
        description: Version, e.g. 0.4.5 or 0.4.6-rc.1 (blank uses VERSION)
        required: false
        type: string
        default: ''
      publish:
        description: Publish when complete (unchecked creates a draft release)
        type: boolean
        default: false
      prerelease:
        description: Publish as a preview (alpha/beta/rc versions are always previews)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: create-release-${{ github.ref }}-${{ inputs.release_version || 'version-file' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate the requested release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: plan
        env:
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/prepare_release.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check release dependencies for known vulnerabilities
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt requirements-build.txt

  packages:
    name: Validate and build every platform
    needs: plan
    uses: ./.github/workflows/check-and-package.yml
    with:
      release_version: ${{ needs.plan.outputs.version }}

  publish:
    name: Attach tested packages and finish the release
    needs: [plan, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PUBLISH_REQUESTED: ${{ github.event_name == 'push' || inputs.publish }}
      PRERELEASE_REQUESTED: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*preview*'
          merge-multiple: true
          path: release-staging
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-source
          path: release-staging
      - name: Collect the four archives from native artifact layouts
        run: python3 packaging/collect_release_assets.py release-staging release-assets "$REQUESTED_RELEASE_VERSION"
      - name: Verify versions, commit, native runtime evidence and all checksums
        run: python3 packaging/prepare_release.py --assets release-assets
      - name: Create the release with all four packages
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" --silent
          fi
          args=(--draft --verify-tag --target "$GITHUB_SHA" --title "Library Workbench $REQUESTED_RELEASE_VERSION" --notes-file release-assets/RELEASE-NOTES.md)
          if [[ "$PRERELEASE_REQUESTED" == true ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/Library-Workbench-*.zip release-assets/Library-Workbench-*.tar.gz release-assets/SHA256SUMS "${args[@]}"
          if [[ "$PUBLISH_REQUESTED" == true ]]; then
            publish_args=(--draft=false)
            if [[ "$PRERELEASE_REQUESTED" != true ]]; then publish_args+=(--latest); fi
            gh release edit "$RELEASE_TAG" "${publish_args[@]}"
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
