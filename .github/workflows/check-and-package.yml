name: Check and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: Package version (blank uses VERSION; does not publish)
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      release_version:
        description: Version embedded in release archives
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  LIBRARY_WORKBENCH_VERSION: ${{ inputs.release_version || '' }}

concurrency:
  group: workbench-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_version || 'development' }}
  cancel-in-progress: ${{ !inputs.release_version && github.ref_type != 'tag' }}

jobs:
  test:
    name: Source checks · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-26, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Check English interface and documentation spelling
        if: runner.os == 'Linux'
        run: python packaging/check_english.py --output ci-output
      - name: Benchmark synthetic 33k and 100k libraries
        if: runner.os == 'Linux'
        run: python packaging/benchmark_library.py --output ci-output/performance.json
      - run: python -m unittest discover -v
      - name: Generate a disposable synthetic Serato fixture
        if: runner.os == 'Linux'
        run: python packaging/create_serato_fixture.py --output ci-output/serato-smoke-fixture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: synthetic-serato-smoke-fixture
          path: ci-output/serato-smoke-fixture
          retention-days: 14
          if-no-files-found: error
      - run: python packaging/smoke_desktop.py --source . --report ci-output/source-smoke.json
      - name: Check browser JavaScript syntax
        if: runner.os == 'Linux'
        run: |
          for file in static/*.js; do node --check "$file"; done
          node packaging/check_journal_monitor.cjs
          bash -n start.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-validation-${{ matrix.os }}
          path: ci-output/*.json
          if-no-files-found: error
          retention-days: 14

  windows-build:
    name: Assemble Windows portable and Linux source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Use the Ubuntu archive for package downloads
        run: |
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i -E 's@https?://[a-z0-9.-]+\.ec2\.archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' "$apt_source"
            fi
          done
      - name: Install launcher compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: python packaging/build_windows.py
      - run: python packaging/build_source.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-portable-assembly
          if-no-files-found: error
          retention-days: 14
          path: |
            releases/*windows*.zip
            releases/*windows*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-source
          path: releases/*linux-source.tar.gz*
          if-no-files-found: error
          retention-days: 14

  windows-portable:
    name: Test actual Windows portable executable
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-portable-assembly
          path: .artifacts
      - name: Extract into a path containing spaces and Unicode
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          archive=next(Path('.artifacts').glob('*.zip'))
          with zipfile.ZipFile(archive) as package:
              package.extractall('portable 日本 é')
      - run: python packaging/smoke_desktop.py --application "portable 日本 é/Library Workbench" --report ci-output/windows-portable.json
      - run: python packaging/record_windows_validation.py "portable 日本 é/Library Workbench" ci-output/windows-portable.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-x64-portable
          if-no-files-found: error
          retention-days: 14
          path: |
            releases/*windows*.zip
            releases/*windows*.sha256
            ci-output/windows-portable.json

  macos-app:
    name: Build and test macOS · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: python packaging/build_macos.py
        env:
          LIBRARY_WORKBENCH_EXPECTED_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-${{ matrix.arch }}-portable
          if-no-files-found: error
          retention-days: 14
          path: |
            releases/*macos*.zip
            releases/*macos*.sha256

  linux-portable:
    name: Build and test Linux portable executable
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      LIBRARY_WORKBENCH_BUILD_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore pinned shared Python runtime cache
        id: linux-runtime-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/runtime-cache
          key: workbench-shared-python-x86_64-${{ hashFiles('packaging/build_linux_python.py', '.github/workflows/check-and-package.yml') }}
      - name: Bundle Python and dependencies on glibc 2.28
        run: |
          docker run --rm --volume "$PWD:/work" --workdir /work \
            --env GITHUB_SHA --env LIBRARY_WORKBENCH_VERSION --env LIBRARY_WORKBENCH_BUILD_IMAGE \
            --env "WORKBENCH_BUILD_UID=$(id -u)" --env "WORKBENCH_BUILD_GID=$(id -g)" \
            "$LIBRARY_WORKBENCH_BUILD_IMAGE" /bin/bash -eu -c '
              dnf install -y bzip2-devel libffi-devel xz-devel openssl-devel sqlite-devel zlib-devel
              /opt/python/cp313-cp313/bin/python packaging/build_linux_python.py
              /opt/workbench-python/bin/python3.13 -m pip install -r requirements.txt -r requirements-build.txt
              /opt/workbench-python/bin/python3.13 packaging/build_linux.py
              chown -R "$WORKBENCH_BUILD_UID:$WORKBENCH_BUILD_GID" releases .build/runtime-cache
            '
      - name: Save verified runtime cache from trusted main builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.linux-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/runtime-cache
          key: ${{ steps.linux-runtime-cache.outputs.cache-primary-key }}
      - name: Extract into a path containing spaces and Unicode
        shell: python
        run: |
          from pathlib import Path
          import tarfile
          archive=next(Path('releases').glob('*linux-x86_64.tar.gz'))
          with tarfile.open(archive) as package:
              package.extractall('portable 日本 é',filter='data')
      - name: Test bundled executable on Ubuntu without external Python
        run: python packaging/smoke_desktop.py --linux-application "portable 日本 é/Library Workbench" --report ci-output/linux-portable.json
      - run: python packaging/record_linux_validation.py "portable 日本 é/Library Workbench" ci-output/linux-portable.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-x86_64-portable
          if-no-files-found: error
          retention-days: 14
          path: |
            releases/*linux-x86_64.tar.gz*
            ci-output/linux-portable.json

  browser-language:
    name: Language and Unicode UI · ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-test.txt -r requirements-browser.txt
      - name: Use the Ubuntu archive for package downloads
        run: |
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i -E 's@https?://[a-z0-9.-]+\.ec2\.archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' "$apt_source"
            fi
          done
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Check desktop UI, languages and native scrollbars
        env:
          GTK_OVERLAY_SCROLLING: '0'
        run: xvfb-run -a python packaging/check_browser_languages.py --headed --browser ${{ matrix.browser }} --output ci-output/languages
      - name: Check real-server workflows, formats and STEMS evidence
        if: matrix.browser == 'chromium'
        run: python packaging/check_workflow_integrity.py --output ci-output/languages/workflow-integrity
      - name: Check Dropbox metadata and deliberate single-file downloads
        run: xvfb-run -a python packaging/check_dropbox_connector_ui.py --headed --browser ${{ matrix.browser }} --output ci-output/languages/dropbox-connector
      - name: Check guided cloud connections and Google Drive workflows
        run: xvfb-run -a python packaging/check_cloud_connections_ui.py --headed --browser ${{ matrix.browser }} --output ci-output/languages/cloud-connections
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: language-validation-${{ matrix.browser }}
          path: ci-output/languages/
          if-no-files-found: error
          retention-days: 14

  onetagger-roundtrip:
    name: OneTagger producer-to-importer round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fantuz/onetagger
          ref: d3311427c9716d47ad0598ab89129557cb31a927
          path: .ci-onetagger
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install producer native dependencies
        run: |
          python -m py_compile packaging/check_onetagger_roundtrip.py
          sudo apt-get update
          sudo apt-get install -y lld libasound2-dev libssl-dev pkg-config
      - name: Select producer Rust toolchain
        working-directory: .ci-onetagger
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: .ci-onetagger -> target
          shared-key: onetagger-roundtrip-ubuntu24
          cache-bin: 'false'
          cache-workspace-crates: 'false'
      - name: Verify actual producer reports and reviewed imports
        run: python packaging/check_onetagger_roundtrip.py --producer .ci-onetagger --output ci-output/onetagger-roundtrip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: onetagger-roundtrip
          path: ci-output/onetagger-roundtrip
          if-no-files-found: warn
          retention-days: 14

  pr-checks:
    name: Workbench PR checks
    if: always()
    needs: [test, windows-build, windows-portable, macos-app, linux-portable, browser-language, onetagger-roundtrip]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every source and native package check
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          results=json.loads(os.environ['CHECK_RESULTS'])
          failed=[name for name,result in results.items() if result['result']!='success']
          if failed:
              print('Required checks did not pass:',', '.join(failed))
              sys.exit(1)
          print('All source and native package checks passed')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as summary:
              summary.write('### Validated downloads\n\nSource checks and packaged startup passed on Linux, Windows, Mac Intel and Mac Apple Silicon.\n\n')
              summary.write('[Download this run\'s artifacts]('+os.environ['RUN_URL']+'#artifacts). Development artifacts expire after 14 days; published release downloads are retained.\n\n')
              summary.write('| Platform | Artifact |\n| --- | --- |\n| Windows x64 | `windows-x64-portable` |\n| Mac Apple Silicon | `macos-arm64-portable` |\n| Mac Intel | `macos-x86_64-portable` |\n| Linux x86-64 | `linux-x86_64-portable` |\n| Linux source | `linux-source` |\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: '*-portable'
          merge-multiple: true
          path: .release-staging
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-source
          path: .release-staging
      - name: Verify all five archives share this commit and source
        run: |
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'packaging')
          from collect_release_assets import collect
          from release_tools import build_version,verify_assets
          version=build_version()
          collect('.release-staging','.release-assets',version)
          names=verify_assets('.release-assets',version,os.environ['GITHUB_SHA'])
          Path('ci-output').mkdir(exist_ok=True)
          Path('ci-output/release-validation.json').write_text(json.dumps({'status':'passed','commit':os.environ['GITHUB_SHA'],'version':version,'archives':names},indent=2),encoding='utf-8')
          print('Verified all five native/source archives:',', '.join(names))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-set-validation
          path: |
            ci-output/release-validation.json
            .release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

