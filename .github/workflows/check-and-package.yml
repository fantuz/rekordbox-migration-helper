name: Check and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: Package version (blank uses VERSION; does not publish)
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      release_version:
        description: Version embedded in release archives
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  LIBRARY_WORKBENCH_VERSION: ${{ inputs.release_version || '' }}

concurrency:
  group: workbench-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_version || 'development' }}
  cancel-in-progress: ${{ !inputs.release_version && github.ref_type != 'tag' }}

jobs:
  test:
    name: Source checks · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-test.txt
      - run: python -m unittest discover -v
      - run: python packaging/smoke_desktop.py --source . --report ci-output/source-smoke.json
      - name: Check browser JavaScript syntax
        if: runner.os == 'Linux'
        run: |
          node --check static/app.js
          node --check static/explorer.js
          node --check static/lab.js
          node --check static/cleanup.js
          node --check static/discovery.js
          node --check static/history.js
          node --check static/insights.js
          node --check static/track-details.js
          node --check static/i18n.js
          node --check static/ui-language.js
          node --check static/documentation.js
          node --check static/d3-hierarchy-3.1.2.min.js
          bash -n start.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-validation-${{ matrix.os }}
          path: ci-output/*.json
          if-no-files-found: error
          retention-days: 14

  windows-build:
    name: Assemble Windows portable and Linux source
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install launcher compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: python packaging/build_windows.py
      - run: python packaging/build_source.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-portable-assembly
          if-no-files-found: error
          retention-days: 14
          path: |
            releases/*windows*.zip
            releases/*windows*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-source
          path: releases/*linux-source.tar.gz*
          if-no-files-found: error
          retention-days: 14

  windows-portable:
    name: Test actual Windows portable executable
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-portable-assembly
          path: .artifacts
      - name: Extract into a path containing spaces and Unicode
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          archive=next(Path('.artifacts').glob('*.zip'))
          with zipfile.ZipFile(archive) as package:
              package.extractall('portable 日本 é')
      - run: python packaging/smoke_desktop.py --application "portable 日本 é/Library Workbench" --report ci-output/windows-portable.json
      - run: python packaging/record_windows_validation.py "portable 日本 é/Library Workbench" ci-output/windows-portable.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-x64-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            releases/*windows*.zip
            releases/*windows*.sha256
            ci-output/windows-portable.json

  macos-app:
    name: Build and test macOS · ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: python packaging/build_macos.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-preview-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            releases/*macos*.zip
            releases/*macos*.sha256

  browser-language:
    name: Language and Unicode UI · ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-test.txt -r requirements-browser.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python packaging/check_browser_languages.py --browser ${{ matrix.browser }} --output ci-output/languages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: language-validation-${{ matrix.browser }}
          path: ci-output/languages/
          if-no-files-found: error
          retention-days: 14

  pr-checks:
    name: Workbench PR checks
    if: always()
    needs: [test, windows-build, windows-portable, macos-app, browser-language]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every source and native package check
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          results=json.loads(os.environ['CHECK_RESULTS'])
          failed=[name for name,result in results.items() if result['result']!='success']
          if failed:
              print('Required checks did not pass:',', '.join(failed))
              sys.exit(1)
          print('All source and native package checks passed')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as summary:
              summary.write('### Validated downloads\n\nSource checks and packaged startup passed on Linux, Windows, Mac Intel and Mac Apple Silicon.\n\n')
              summary.write('[Download this run\'s artifacts]('+os.environ['RUN_URL']+'#artifacts). Development artifacts expire after 14 days; published release downloads are retained.\n\n')
              summary.write('| Platform | Artifact |\n| --- | --- |\n| Windows x64 | `windows-x64-preview` |\n| Mac Apple Silicon | `macos-preview-macos-15` |\n| Mac Intel | `macos-preview-macos-15-intel` |\n| Linux source | `linux-source` |\n')
          PY
