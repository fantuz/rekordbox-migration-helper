name: Translation correction
description: Improve an interface label, explanation or accessibility text
title: "Translation: "
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [English, Deutsch, Français, Italiano, Español, Ελληνικά, Polski, Čeština, Русский]
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page or control
      description: Include the application version and whether this is the live app or offline HTML.
    validations:
      required: true
  - type: textarea
    id: wording
    attributes:
      label: Current and proposed wording
      description: Explain the correction. Keep placeholder names and format identifiers unchanged. Do not include private library exports or audio.
    validations:
      required: true
